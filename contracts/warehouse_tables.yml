# =====================================================================
# CANONICAL WAREHOUSE TABLE INVENTORY (NORMATIVE)
# Storage: Parquet files queried through DuckDB. No database server.
# Layers: raw -> bronze -> silver -> features/states -> predictions
# =====================================================================
version: "2026.1.0"

storage:
  format: parquet
  engine: duckdb
  compression: zstd

pit_columns_required_on_time_varying_tables:
  - event_time        # when the real-world event happened
  - available_at      # earliest timestamp this record could legitimately be known
  - ingested_at       # when WE wrote it
  - provider
  - provider_record_id

layers:
  raw: "data/raw/bdl/<endpoint>/ — immutable JSON + sidecar metadata"
  bronze: "1:1 typed parquet of raw payloads, provider IDs still present"
  silver: "canonical IDs, normalized types, deduplicated"
  features: "point-in-time feature rows keyed by (as_of, entity)"
  states: "empirical-Bayes posterior snapshots keyed by (as_of, entity, metric)"

tables:

  identity:
    teams:
      key: [canonical_team_id]
      pit: false
    players:
      key: [canonical_player_id]
      pit: false
    provider_team_ids:
      key: [provider, provider_team_id]
      pit: false
    provider_player_ids:
      key: [provider, provider_player_id]
      pit: false
    provider_game_ids:
      key: [provider, provider_game_id]
      pit: false

  schedule:
    games:
      key: [canonical_game_id, available_at]
      pit: true
      note: "append-only schedule/final snapshots; training outcomes use status_state == 'final' only"

  snapshots:
    roster_snapshots:
      key: [canonical_team_id, canonical_player_id, available_at]
      pit: true
      rule: "append-only; never overwrite"
    injury_snapshots:
      key: [canonical_player_id, available_at]
      pit: true
      rule: "append-only; Saturday never overwrites Monday"
    injury_snapshot_runs:
      key: [provider, available_at]
      pit: true
      deprecated: true
      note: >
        LEGACY (PHASE 2), read-only as of the post-PHASE-4 cleanup. No
        production code path writes new rows here anymore -- LeanIngestor's
        one-shot ingest_week() call site was removed. Preserved only so any
        pre-existing rows an old installation already has can still be
        migrated via migrate_legacy_injury_runs(). injury_data_available
        reads collector_resource_runs (see the collector layer below)
        exclusively. See nflprops.data.injury_availability.
      columns: [provider, snapshot_type, available_at, season, week, collection_status, row_count]

  collector:
    collector_runs:
      key: [collector_run_id]
      pit: true
      note: >
        PHASE 4. One row per overall collection cycle. NOT authoritative for
        resource-level feed availability by itself -- a cycle can be PARTIAL
        (some resources succeeded, some failed) or SUCCESS with a resource
        that returned zero legitimate rows. See collector_resource_runs.
      columns: [collector_run_id, provider, season, week, started_at, completed_at,
        status, cadence_seconds, nearest_unstarted_kickoff, games_requested,
        games_received, game_odds_rows, prop_rows, roster_rows, injury_rows,
        retry_count, error_code, error_detail, source_sha256, config_sha256,
        created_at]
    collector_resource_runs:
      key: [resource_run_id]
      pit: true
      note: >
        PHASE 4. Authoritative source for resource-level feed availability
        (games, rosters, injuries, game odds, player props). A successful
        fetch that legitimately returns zero rows (e.g. a healthy-slate
        injury check) is collection_status=SUCCESS with row_count=0 --
        never conflated with "the feed was never checked". MARKET_NOT_POSTED
        (market resources only) proves the feed was checked without
        implying any quote exists. See
        nflprops.collection.resource_availability.resource_feed_available_at.
      columns: [resource_run_id, collector_run_id, provider, resource_type,
        scope_type, scope_json, season, week, started_at, collector_received_at,
        completed_at, collection_status, row_count, retry_count, error_code,
        error_detail, raw_payload_sha256, created_at]

  outcomes:
    player_game_stats:
      key: [canonical_game_id, canonical_player_id]
      pit: true
      note: "PRIMARY GROUND TRUTH; retain every provider column"
    player_season_stats:
      key: [canonical_player_id, season, season_type]
      pit: false
      leakage: "QA only; never a point-in-time feature"
    team_game_stats:
      key: [canonical_game_id, canonical_team_id]
      pit: true
      note: "opponent features are built by REVERSING these rows within a game"
    team_season_stats:
      key: [canonical_team_id, season, season_type]
      pit: false
      warning: "schema exposes no opponent or defensive fields despite its description"

  advanced:
    advanced_passing_weekly:
      key: [canonical_player_id, season, week]
      pit: true
    advanced_rushing_weekly:
      key: [canonical_player_id, season, week]
      pit: true
    advanced_receiving_weekly:
      key: [canonical_player_id, season, week]
      pit: true

  pbp:
    plays_raw:
      key: [canonical_game_id, play_id]
      pit: true
    plays_parsed:
      key: [canonical_game_id, play_id]
      pit: true
    pbp_reconciliation:
      key: [canonical_game_id]
      pit: true
      columns: [pbp_quality, score, mismatch_report]

  market:
    game_odds_snapshots:
      key: [canonical_game_id, vendor, collector_received_at]
      pit: true
    game_opening_odds:
      key: [canonical_game_id, vendor]
      pit: true
    player_prop_snapshots:
      key: [canonical_game_id, canonical_player_id, prop_type, vendor, collector_received_at]
      pit: true
      note: "BDL retains no live prop history — this table IS the history"
    player_prop_openings:
      key: [canonical_game_id, canonical_player_id, prop_type, vendor]
      pit: true

  dfs:
    dfs_slates:
      key: [slate_id]
      pit: true
      optional: true
    dfs_draftables:
      key: [slate_id, draftable_id]
      pit: true
      optional: true

  state:
    player_states:
      key: [canonical_player_id, metric, as_of]
      pit: true
      columns: [posterior_mean, posterior_var, effective_n, prior_mean, last_updated]
    team_states:
      key: [canonical_team_id, metric, as_of]
      pit: true
      columns: [posterior_mean, posterior_var, effective_n, prior_mean, last_updated]
    role_states:
      key: [canonical_team_id, canonical_player_id, metric, as_of]
      pit: true
      columns: [posterior_mean, posterior_var, effective_n, prior_mean, last_updated]

  modeling:
    game_features:
      key: [canonical_game_id, as_of]
      pit: true
    player_features:
      key: [canonical_game_id, canonical_player_id, as_of]
      pit: true
    training_rows:
      key: [row_id]
      pit: true

  simulation:
    simulation_runs:
      key: [run_id]
      pit: false
    simulation_player_results:
      key: [run_id, draw_id, canonical_player_id]
      pit: false
      note: "the JOINT draw matrix; enables honest SGP pricing and correlation checks"

  output:
    predictions:
      key: [prediction_id]
      pit: false
      note: >
        PHASE 5: run_id/checkpoint_name are additive, nullable columns
        (null on any non-orchestration call site, e.g. ad-hoc backtests) --
        see nflprops.orchestration.run_store and
        prediction_runs (orchestration layer below) for the official
        checkpoint run they trace back to.
    settled_predictions:
      key: [prediction_id]
      pit: false

  orchestration:
    prediction_runs:
      key: [run_id]
      pit: true
      note: >
        PHASE 5. Operational/audit lifecycle for official per-game pregame
        checkpoints (T48H/T24H/T6H/T90M/T30M, plus MANUAL diagnostic runs).
        Never stores prediction outputs itself (those remain in
        predictions/simulation_player_results, immutable regardless of a
        run's status). scheduled_as_of is the model knowledge-time cutoff --
        never the wall-clock execution time. See
        nflprops.orchestration.run_store and
        docs/ORCHESTRATION_ARCHITECTURE.md.
      columns: [run_id, season, week, game_id, checkpoint_name, scheduled_as_of,
        kickoff_at, flow_started_at, flow_completed_at, status, model_version,
        config_sha256, source_sha256, data_manifest_sha256, n_draws,
        retained_joint_draws, publication_status, is_final_forecast,
        fallback_from_checkpoint, failure_code, failure_detail, created_at]
    player_game_projections:
      key: [projection_id]
      unique: [run_id, player_id, stat_name]
      foreign_key: {run_id: "prediction_runs.run_id"}
      pit: false
      note: >
        PHASE 7C. player_game_projections = immutable sportsbook-independent
        summarized player distribution output. One row per
        (run_id, player_id, stat_name) for each of the 30 approved Phase-7
        registry stats; projection_id = SHA-256(run_id | player_id |
        stat_name). Carries NO sportsbook fields and NO separate median
        column (p50 IS the median). Never updated or overwritten: an
        identical scientific re-run is an idempotent no-op, and any
        differing scientific field for an existing projection_id is a hard
        error. created_at is operational metadata only and is excluded from
        scientific equality. Requires a real prediction_runs parent row;
        ad-hoc/backtest projection frames stay in memory only. FK is NOT
        ON DELETE CASCADE. See nflprops.orchestration.projection_store and
        migrations/versions/0004_player_game_projections.py.
      columns: [projection_id, run_id, season, week, game_id, player_id,
        team_id, position_group, stat_name, n_draws, mean, p05, p10, p25,
        p50, p75, p90, p95, created_at]
    player_game_threshold_events:
      key: [threshold_event_id]
      unique: [run_id, player_id, stat_name, event_type, threshold]
      foreign_key: {run_id: "prediction_runs.run_id"}
      pit: false
      note: >
        PHASE 8C. player_game_threshold_events = immutable
        sportsbook-independent store of raw AT_LEAST threshold / milestone
        probabilities derived (PHASE 8B) from the SAME Phase-7 coherent
        simulation draws that feed player_game_projections. One row per
        (run_id, player_id, stat_name, event_type, threshold);
        threshold_event_id = SHA-256(run_id | player_id | stat_name |
        event_type | threshold). Stores ONLY p_hit (p_miss = 1 - p_hit is
        never stored) -- no American odds, no push probability, no EV, no
        vendor, no sportsbook line/price. CHECK constraints: threshold > 0,
        n_draws > 0, 0 <= p_hit <= 1, event_type = 'AT_LEAST'. Never
        updated or overwritten: an identical scientific re-run is an
        idempotent no-op, any differing scientific field for an existing
        threshold_event_id is a hard error, and p_hit equality is EXACT
        (no tolerance). created_at is operational metadata only, excluded
        from scientific equality. Requires a real prediction_runs parent
        row AND a complete Phase-7 player_game_projections artifact for the
        same run (the authoritative eligible-player set) -- the persisted
        product is the complete E x catalog.event_count grid, never a
        sparse subset. FK is NOT ON DELETE CASCADE. See
        nflprops.orchestration.threshold_event_store and
        migrations/versions/0005_player_game_threshold_events.py.
      columns: [threshold_event_id, run_id, season, week, game_id,
        player_id, team_id, position_group, stat_name, event_type,
        threshold, p_hit, n_draws, catalog_version, created_at]
    player_prop_pricing_artifacts:
      key: [run_id]
      foreign_key: {run_id: "prediction_runs.run_id"}
      pit: false
      note: >
        PHASE 9C. Header row proving canonical push-aware sportsbook pricing
        completed for run_id, even when it produced zero priced rows (a
        zero-quote MODEL_ONLY run) -- row_count = 0 is a valid, complete
        artifact; its ABSENCE, not its row count, means "pricing never
        ran." Pins row_count and scientific_content_sha256 (a deterministic,
        order-independent hash of the complete scientific
        player_prop_prices row set) so a reconciliation query never has to
        re-trust an unverified count. Immutable: an exact scientific retry
        (any created_at) is a no-op; a differing row_count or hash for an
        existing run_id is a hard error. FK is NOT ON DELETE CASCADE. See
        nflprops.orchestration.pricing_store and
        migrations/versions/0006_player_prop_pricing.py.
      columns: [run_id, season, week, game_id, as_of, model_version,
        row_count, scientific_content_sha256, created_at]
    player_prop_prices:
      key: [prediction_id]
      foreign_key: {run_id: "prediction_runs.run_id"}
      pit: true
      note: >
        PHASE 9B/9C. Immutable canonical push-aware MODEL fair pricing --
        one row per priced quote/side, keyed by the pre-existing,
        UNCHANGED prediction_id (blake2b, nflprops.market.current_pricing.
        prediction_id; not recomputed with SHA-256 here, so this table does
        not introduce a second competing pricing identity). Carries raw
        win/push probabilities, the conditional non-push MODEL fair
        probability/odds (p_model_fair_nonpush, model_fair_decimal,
        model_fair_american -- distinct from the sportsbook-devigged
        p_market_fair), push-aware EV against the offered American price,
        and the full modeled-distribution summary (model_mean, model_median,
        p05-p95, p_model_calibrated) -- all SCIENTIFIC and part of
        scientific_content_sha256; confidence_tier and quote_age_seconds
        are DERIVED_REDUNDANT (proven pure functions of already-scientific
        columns) and excluded from the hash; created_at is OPERATIONAL
        only. quote_available_at <= as_of is enforced independently here
        (defense in depth) in addition to the Phase-9B pricing layer's own
        PIT guard. Requires a real prediction_runs parent row; every row's
        season/week/game_id/model_version/n_draws/as_of must agree with the
        parent (hard PricingProvenanceError otherwise). FK is NOT ON DELETE
        CASCADE. See nflprops.orchestration.pricing_store and
        migrations/versions/0006_player_prop_pricing.py.
      columns: [prediction_id, run_id, season, week, game_id, player_id,
        prop_type, market_type, vendor, side, line, american_odds,
        p_model_raw, p_push, p_model_fair_nonpush, model_fair_decimal,
        model_fair_american, p_market_fair, devig_method, devig_confidence,
        ev_per_unit, edge, n_draws, model_version, as_of,
        quote_available_at, quote_time_source, provider_updated_at,
        opened_at, collector_received_at, confidence_tier, model_mean,
        model_median, p05, p10, p25, p50, p75, p90, p95, p_model_calibrated,
        quote_age_seconds, created_at]
    player_prop_distribution_artifacts:
      key: [run_id]
      foreign_key: {run_id: "prediction_runs.run_id"}
      pit: false
      note: >
        PHASE 10B. Header row proving the canonical raw exact-outcome PMF
        product completed for run_id. Pins distribution_count (always
        E * 25, E = the Phase-7 eligible player count for the run),
        outcome_row_count, and scientific_content_sha256 (a deterministic,
        order-independent hash of the complete raw PMF set). Immutable:
        distribution_id already embeds run_id, so cross-run identity
        collisions are structurally impossible and conflict detection is a
        single artifact-level gate -- an exact scientific retry (any
        created_at) is a no-op; a differing distribution_count/
        outcome_row_count/hash for an existing run_id is a hard error. FK
        is NOT ON DELETE CASCADE. See
        nflprops.orchestration.distribution_store and
        migrations/versions/0007_player_prop_distributions.py.
      columns: [run_id, season, week, game_id, as_of, model_version,
        n_draws, distribution_count, outcome_row_count,
        scientific_content_sha256, created_at]
    player_prop_distributions:
      key: [distribution_key]
      unique: [distribution_id, "run_id,player_id,prop_type"]
      foreign_key: {run_id: "prediction_runs.run_id"}
      pit: false
      note: >
        PHASE 10B. One row per (run_id, player_id, prop_type) -- one
        canonical raw PMF, sportsbook-independent, derived from the SAME
        Phase-7 coherent simulation draws (nflprops.simulation.props.
        prop_values, UNCHANGED) that feed player_game_projections. Keyed
        externally by distribution_id = SHA-256(run_id | player_id |
        prop_type) and internally by a deterministic BIGINT
        distribution_key surrogate derived from distribution_id (never a
        DB sequence -- identical across local Warehouse and PostgreSQL,
        stable under retry). Carries ONLY structural metadata
        (support_min/support_max -- signed, since yardage props can be
        negative -- n_draws, outcome_count, raw_content_sha256); no
        mean/median/percentile/over/under/push/fair-odds summary is ever
        stored here -- those are deterministically derived later from
        player_prop_distribution_outcomes only. Requires a real
        prediction_runs parent row AND a complete Phase-7
        player_game_projections artifact for the same run (the
        authoritative eligible-player set) -- the persisted product is the
        complete E x 25 grid, never a sparse subset, no position
        filtering. FK is NOT ON DELETE CASCADE. See
        nflprops.orchestration.distribution_store and
        migrations/versions/0007_player_prop_distributions.py.
      columns: [distribution_key, distribution_id, run_id, game_id,
        player_id, team_id, position_group, prop_type, support_min,
        support_max, n_draws, outcome_count, raw_content_sha256, created_at]
    player_prop_distribution_outcomes:
      key: ["distribution_key,outcome"]
      foreign_key: {distribution_key: "player_prop_distributions.distribution_key"}
      pit: false
      note: >
        PHASE 10B. One row per (distribution, outcome) with p_raw > 0 --
        P_raw(X=x) = count(draw == x) / n_draws over ALL simulation draws.
        Only strictly-positive-probability outcomes are stored; an outcome
        inside [support_min, support_max] that is absent has probability
        exactly zero, and no positive tail mass is ever discarded. CHECK
        constraint: 0 < p_raw <= 1. Immutable together with its parent
        player_prop_distributions row (never independently mutated). See
        nflprops.orchestration.distribution_store and
        migrations/versions/0007_player_prop_distributions.py.
      columns: [distribution_key, outcome, p_raw]
    player_prop_prediction_distribution_links:
      key: [prediction_id]
      foreign_key: {prediction_id: "player_prop_prices.prediction_id",
        distribution_id: "player_prop_distributions.distribution_id"}
      pit: false
      note: >
        PHASE 10B. Explicit prediction_id -> distribution_id linkage so the
        certified, immutable player_prop_prices table is never altered to
        carry a distribution column. Many sportsbook quotes/lines for the
        same (run_id, player_id, prop_type) link to the SAME
        distribution_id -- no PMF duplication. A zero-quote run has a
        complete set of distributions and legitimately zero links.
        Immutable: an exact retry (same distribution_id) is a no-op; a
        differing distribution_id for an already-linked prediction_id is a
        hard error. See nflprops.orchestration.distribution_store and
        migrations/versions/0007_player_prop_distributions.py.
      columns: [prediction_id, distribution_id, created_at]
    calibration_artifacts:
      key: [calibration_artifact_id]
      pit: false
      note: >
        PHASE 10C1. One immutable row per fitted joint-game calibration
        artifact -- REGISTRY ONLY: no calibration algorithm, no fitting,
        no draw weights, no calibrated PMF (that is PHASE 10C2+). Scope is
        locked to scope_type = 'JOINT_GAME' (contracts/
        calibration_registry.yml: live_scope_is_joint_game_only) -- there
        is no live public prop/player/position-specific calibration scope,
        since that would imply multiple simultaneous weight vectors over
        the same game and break joint coherence. calibration_artifact_id
        is a deterministic SHA-256 over the artifact's identity fields
        (nflprops.calibration.artifact.compute_calibration_artifact_id);
        scientific_content_sha256 is a second, broader SHA-256 over every
        immutable column, used for the exact-retry-vs-conflict gate. The
        payload bytes themselves are opaque in PHASE 10C1 and live in
        object storage (nflprops.data.storage.object_store, same split as
        simulation_artifacts from migration 0001) -- this table stores
        only object_uri/payload_sha256/payload_byte_count. created_at is
        operational metadata only. No FK to prediction_runs: a calibration
        artifact is cross-run (fit once, applied to many future runs). See
        nflprops.calibration.artifact/.registry and
        migrations/versions/0008_calibration_artifact_registry.py.
      columns: [calibration_artifact_id, calibration_schema_version,
        algorithm_family, algorithm_version, scope_type, checkpoint_scope,
        base_model_version, simulation_config_version,
        feature_contract_version, prop_contract_version,
        calibration_contract_version, training_cutoff, training_start,
        training_end, training_manifest_sha256, code_sha, payload_format,
        payload_schema_version, object_uri, payload_sha256,
        payload_byte_count, scientific_content_sha256, created_at]
    calibration_validations:
      key: [validation_id]
      foreign_key: {calibration_artifact_id: "calibration_artifacts.calibration_artifact_id"}
      pit: false
      note: >
        PHASE 10C1. Append-only validation evidence -- one artifact may
        accumulate many rows over time; a row is never mutated or deleted.
        Explicitly records PropType label-coverage completeness
        (directly_labeled_prop_types/unlabeled_prop_types, JSON-encoded
        TEXT): Phase 10C-A found exactly 15 of the 25 certified PropTypes
        have a direct historical settlement label
        (nflprops.pipelines.settle); the other 10 are PBP-gated
        (contracts/prop_map.yml confidence_tier 3) and have none. A
        validation row must never claim direct validation for one of
        those ten. metrics_json is deliberately generic/versioned in
        PHASE 10C1 -- actual metric computation is PHASE 10C2.
        approval_required_gates
        (chronology/leakage/simulation-invariants/reproducibility/
        support-preservation/first-td-simplex) gate an APPROVED lifecycle
        event; promotion_gate_passed is a separate, strictly additional
        bar required only for a PROMOTED event
        (contracts/calibration_registry.yml). See
        nflprops.calibration.registry.record_validation.
      columns: [validation_id, calibration_artifact_id,
        validation_schema_version, validation_manifest_sha256, scored_from,
        scored_through, total_game_count, pit_faithful_game_count,
        degraded_pit_game_count, total_label_count,
        directly_labeled_prop_types, unlabeled_prop_types, metrics_json,
        chronology_checks_passed, leakage_checks_passed,
        simulation_invariants_passed, reproducibility_passed,
        support_preservation_passed, first_td_simplex_passed,
        promotion_gate_passed, created_at]
    calibration_lifecycle_events:
      key: [lifecycle_event_id]
      foreign_key: {calibration_artifact_id: "calibration_artifacts.calibration_artifact_id",
        validation_id: "calibration_validations.validation_id"}
      pit: false
      note: >
        PHASE 10C1. Append-only REGISTERED / APPROVED / PROMOTED /
        INVALIDATED / RETIRED events -- the scientific calibration_artifacts
        row is never mutated to change approval/promotion state; every
        state change is a new event row. validation_id is nullable
        (REGISTERED/INVALIDATED/RETIRED need not reference a validation).
        INVALIDATED/RETIRED are terminal: once recorded, no further
        APPROVED/PROMOTED event may ever be recorded for that artifact,
        and nflprops.calibration.registry.resolve_calibration_champion
        must never resolve it -- independent of whatever a (possibly
        stale) calibration_champions row still points at. See
        nflprops.calibration.registry.
      columns: [lifecycle_event_id, calibration_artifact_id, event_type,
        validation_id, reason_code, reason_detail, created_at]
    calibration_champions:
      key: [champion_key]
      foreign_key: {calibration_artifact_id: "calibration_artifacts.calibration_artifact_id",
        promoted_via_event_id: "calibration_lifecycle_events.lifecycle_event_id"}
      pit: false
      note: >
        PHASE 10C1. The ONE intentionally MUTABLE table in the calibration
        registry: a pointer, not a scientific artifact. champion_key is a
        deterministic SHA-256 of
        (scope_type, checkpoint_scope, compatibility_digest)
        (nflprops.calibration.artifact.compute_champion_key) -- at most one
        row may exist per exact applicability key. A row is written ONLY
        by nflprops.calibration.registry.promote_calibration_champion
        after an explicit, successful promotion decision -- never by
        "latest artifact wins", and registering or approving an artifact
        never touches this table. No wall-clock expiry of any kind
        (contracts/calibration_registry.yml: no_wall_clock_expiry): a
        quiet day with no new settled labels or no challenger promotion
        leaves the champion pointer exactly as it was.
      columns: [champion_key, scope_type, checkpoint_scope,
        compatibility_digest, calibration_artifact_id, promoted_via_event_id,
        updated_at]

  governance:
    model_registry:
      key: [model_version]
      pit: false
    data_manifests:
      key: [manifest_id]
      pit: false
