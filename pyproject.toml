[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "nflprops"
version = "2026.1.1"
description = "NFL player prop prediction system. Every prop derived from one coherent game simulation."
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
authors = [{ name = "Risky-Scout" }]
keywords = ["nfl", "sports-betting", "player-props", "monte-carlo", "quantitative"]
classifiers = [
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Scientific/Engineering :: Mathematics",
  "Private :: Do Not Upload",
]

# Deliberately small. SPEC §62: v1 does not require neural frameworks. Add a
# dependency only when walk-forward testing proves it earns its place.
dependencies = [
  "numpy>=1.26,<2.5",
  "scipy>=1.11",
  "polars>=0.20",
  "pyarrow>=15",
  "duckdb>=0.10",
  "scikit-learn>=1.4",
  "statsmodels>=0.14",
  "pydantic>=2.6",
  "httpx>=0.27",
  "joblib>=1.3",
  "typer>=0.12",
  "PyYAML>=6.0",
  "tomli>=2.0; python_version<'3.11'",
]

[project.optional-dependencies]
challenger = ["lightgbm>=4.3", "shap>=0.45"]
dev = [
  "build>=1.2",
  "pytest>=8.0",
  "pytest-cov>=5.0",
  "hypothesis>=6.100",
  "respx>=0.21",
  "ruff>=0.4",
  "mypy==2.3.1",
  "types-PyYAML",
]
# Production storage backend (PHASE 1: managed PostgreSQL + S3-compatible object
# storage). The local DuckDB/Parquet warehouse remains dependency-free; these are
# only imported when NFLPROPS_STORAGE_BACKEND=postgres or an object-store client
# is constructed.
storage = [
  "sqlalchemy>=2.0",
  "psycopg[binary]>=3.1",
  "alembic>=1.13",
  "boto3>=1.34",
]
# PHASE 5: Prefect orchestration around the existing collector and pregame
# prediction pipeline. Core model modules (simulation, state, backtest,
# market math, collection) never import prefect -- only nflprops.orchestration
# does, and only in tasks.py/flows/*.py/deployments.py.
orchestration = [
  "prefect>=3,<4",
]
# BLOCK 2B: the lightweight Wizard runtime release venv installs
# `.[orchestration,runtime]` (deploy/wizard/prepare_release.sh). `runtime`
# adds only what `nflprops platform health` needs beyond the core
# dependencies (alembic, to report the migration head) -- no database
# driver, no object-store client, no training-only challenger packages.
runtime = [
  "alembic>=1.13",
]

[project.scripts]
nflprops = "nflprops.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/nflprops"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers"
markers = [
  "provider_contract: verifies the adapter against the pinned OpenAPI spec",
  "invariants: simulation invariant assertions",
  "leakage: point-in-time correctness detectors",
  "determinism: byte-level reproducibility",
  "slow: long-running",
  "docker: requires a local Docker daemon (PostgreSQL/MinIO integration tests)",
]

[tool.ruff]
line-length = 88
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "SIM", "RUF"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.11"
strict = true
warn_unreachable = true
ignore_missing_imports = true
files = ["src/nflprops"]

[tool.coverage.run]
source = ["src/nflprops"]
branch = true
