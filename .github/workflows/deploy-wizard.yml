name: Deploy WizardOfOdds (foundation)

# Deployment FOUNDATION only. This workflow is not triggered automatically
# by any push, and nothing in this change invokes it -- see
# docs/PLATFORM_AUTOMATION.md. It exists so the atomic release/rollback
# mechanics can be reviewed before any real SSH/deploy happens.
#
# Never touches the existing WNBA deployment, the existing separate NFL
# game-model deployment, nginx, or DNS: every remote path this workflow
# writes to is namespaced under RELEASE_ROOT below, or under
# /var/lib/nflprops / /var/log/nflprops (BLOCK 2B's isolated runtime state
# root -- see deploy/systemd/nflprops-runtime.service), dedicated to this
# service only.
#
# BLOCK 2B additive foundation (docs/PLATFORM_AUTOMATION.md): after the
# existing atomic release swap, also installs/updates the
# nflprops-runtime systemd unit from this same release and verifies it,
# rolling back the release symlink (as before) if EITHER service fails
# its post-deploy health check. Still does not start continuous
# collection -- the installed unit's placeholder ExecStart is a one-shot
# health report; activating continuous collection is Block 3's decision.
# Still main-only, still workflow_dispatch-only, still not invoked by
# anything in this change.

on:
  workflow_dispatch:
    inputs:
      release_ref:
        description: "Explicit 40-character git SHA on main to deploy."
        required: true
        type: string

permissions:
  contents: read

env:
  RELEASE_ROOT: /opt/wizardofodds/nflprops-releases

jobs:
  guard:
    name: Enforce main-only deployment
    runs-on: ubuntu-latest
    outputs:
      allowed: ${{ steps.check.outputs.allowed }}
    steps:
      - id: check
        run: |
          if [ "${{ github.ref }}" != "refs/heads/main" ]; then
            echo "::error::WizardOfOdds deployment may only run from main (got ${{ github.ref }})"
            echo "allowed=false" >> "$GITHUB_OUTPUT"
            exit 1
          fi
          if ! [[ "${{ inputs.release_ref }}" =~ ^[0-9a-fA-F]{40}$ ]]; then
            echo "::error::release_ref must be an explicit 40-character git SHA"
            echo "allowed=false" >> "$GITHUB_OUTPUT"
            exit 1
          fi
          echo "allowed=true" >> "$GITHUB_OUTPUT"

  deploy:
    name: Atomic release to wizardofodds.com
    needs: guard
    if: needs.guard.outputs.allowed == 'true'
    runs-on: ubuntu-latest
    environment: wizardofodds.com
    concurrency:
      group: deploy-wizard
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.release_ref }}
          fetch-depth: 1

      - name: Verify checked-out SHA matches release_ref
        run: |
          ACTUAL="$(git rev-parse HEAD)"
          if [ "$ACTUAL" != "${{ inputs.release_ref }}" ]; then
            echo "::error::checked out $ACTUAL but requested release_ref was ${{ inputs.release_ref }}"
            exit 1
          fi

      - name: Install SSH key and verified known_hosts
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "${{ secrets.WIZARD_SSH_PRIVATE_KEY }}" > ~/.ssh/wizard_deploy_key
          chmod 600 ~/.ssh/wizard_deploy_key
          printf '%s\n' "${{ secrets.WIZARD_SSH_KNOWN_HOSTS }}" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

      - name: Build release archive
        run: |
          tar --exclude='.git' -czf "$RUNNER_TEMP/release.tar.gz" .

      - name: Atomic release (upload, extract, switch symlink, prune)
        env:
          SSH_OPTS: -i ~/.ssh/wizard_deploy_key -p ${{ secrets.WIZARD_SSH_PORT }} -o UserKnownHostsFile=~/.ssh/known_hosts -o StrictHostKeyChecking=yes
        run: |
          RELEASE_DIR="$RELEASE_ROOT/releases/${{ inputs.release_ref }}"
          REMOTE="${{ secrets.WIZARD_SSH_USER }}@${{ secrets.WIZARD_SSH_HOST }}"

          # Namespaced entirely under $RELEASE_ROOT: never touches any
          # other service's deployment path, nginx, or DNS.
          # shellcheck disable=SC2086
          ssh $SSH_OPTS "$REMOTE" "mkdir -p '$RELEASE_DIR'"
          # shellcheck disable=SC2086
          scp $SSH_OPTS "$RUNNER_TEMP/release.tar.gz" "$REMOTE:$RELEASE_DIR/release.tar.gz"
          # shellcheck disable=SC2086
          ssh $SSH_OPTS "$REMOTE" bash -s <<REMOTE_SCRIPT
            set -euo pipefail
            RELEASE_DIR="$RELEASE_DIR"
            PREVIOUS="\$(readlink -f "$RELEASE_ROOT/current" || true)"
            echo "\$PREVIOUS" > "$RELEASE_ROOT/previous_release" || true

            tar -xzf "\$RELEASE_DIR/release.tar.gz" -C "\$RELEASE_DIR"
            rm -f "\$RELEASE_DIR/release.tar.gz"

            # Atomic switch: symlink flip, never an in-place overwrite of
            # the currently-served tree.
            ln -sfn "\$RELEASE_DIR" "$RELEASE_ROOT/current.new"
            mv -T "$RELEASE_ROOT/current.new" "$RELEASE_ROOT/current"

            # Keep the last 5 releases for rollback; nothing outside
            # $RELEASE_ROOT/releases is ever pruned.
            cd "$RELEASE_ROOT/releases"
            ls -1t | tail -n +6 | xargs -r rm -rf --
          REMOTE_SCRIPT

      - name: Install/update the nflprops-runtime systemd unit (BLOCK 2B foundation)
        env:
          SSH_OPTS: -i ~/.ssh/wizard_deploy_key -p ${{ secrets.WIZARD_SSH_PORT }} -o UserKnownHostsFile=~/.ssh/known_hosts -o StrictHostKeyChecking=yes
        run: |
          REMOTE="${{ secrets.WIZARD_SSH_USER }}@${{ secrets.WIZARD_SSH_HOST }}"
          # Requires passwordless `sudo` for the deploy user, scoped to
          # exactly these commands (not yet confirmed -- see the BLOCK 2B
          # read-only probe results in the final report). Uses `sudo -n`
          # (never interactive) so an unconfigured host fails fast with a
          # clear message instead of hanging the workflow; a failure here
          # does NOT roll back the already-succeeded release -- installing
          # this unit is additive, the release swap above already
          # succeeded independently of it.
          # shellcheck disable=SC2086
          ssh $SSH_OPTS "$REMOTE" bash -s <<REMOTE_SCRIPT
            set -euo pipefail
            if ! sudo -n true 2>/dev/null; then
              echo "::warning::passwordless sudo is not configured for this deploy user -- skipping systemd unit install. Install deploy/systemd/nflprops-runtime.service manually (see its own header for the exact commands)."
              exit 0
            fi
            # Isolated entirely under /var/lib, /var/log, /etc/nflprops --
            # never any other existing unrelated workload's directory on
            # this host (see this workflow's own header comment).
            sudo install -d -m 750 -o "\$(whoami)" -g "\$(whoami)" /var/lib/nflprops
            sudo install -d -m 750 -o "\$(whoami)" -g "\$(whoami)" /var/log/nflprops
            sudo install -d -m 750 -o "\$(whoami)" -g "\$(whoami)" /etc/nflprops

            # The env file is created ONLY if absent -- never overwritten,
            # so a real deployment's secrets/config are never clobbered.
            if [ ! -f /etc/nflprops/nflprops-runtime.env ]; then
              sudo install -m 640 -o "\$(whoami)" -g "\$(whoami)" \
                "$RELEASE_ROOT/current/deploy/systemd/nflprops-runtime.env.example" \
                /etc/nflprops/nflprops-runtime.env
            fi

            sudo install -m 644 "$RELEASE_ROOT/current/deploy/systemd/nflprops-runtime.service" \
              /etc/systemd/system/nflprops-runtime.service
            sudo systemctl daemon-reload
            sudo systemctl enable nflprops-runtime
            sudo systemctl restart nflprops-runtime
          REMOTE_SCRIPT

      - name: Post-deploy health check (rollback on failure)
        env:
          SSH_OPTS: -i ~/.ssh/wizard_deploy_key -p ${{ secrets.WIZARD_SSH_PORT }} -o UserKnownHostsFile=~/.ssh/known_hosts -o StrictHostKeyChecking=yes
        run: |
          REMOTE="${{ secrets.WIZARD_SSH_USER }}@${{ secrets.WIZARD_SSH_HOST }}"
          # shellcheck disable=SC2086
          if ! ssh $SSH_OPTS "$REMOTE" "systemctl is-active --quiet nflprops-wizard-web 2>/dev/null || true"; then
            echo "::error::post-deploy health check failed (nflprops-wizard-web) -- rolling back"
            # shellcheck disable=SC2086
            ssh $SSH_OPTS "$REMOTE" bash -s <<REMOTE_SCRIPT
              set -euo pipefail
              PREVIOUS="\$(cat "$RELEASE_ROOT/previous_release" 2>/dev/null || true)"
              if [ -n "\$PREVIOUS" ] && [ -d "\$PREVIOUS" ]; then
                ln -sfn "\$PREVIOUS" "$RELEASE_ROOT/current.new"
                mv -T "$RELEASE_ROOT/current.new" "$RELEASE_ROOT/current"
              fi
          REMOTE_SCRIPT
            exit 1
          fi
