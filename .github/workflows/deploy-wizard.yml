name: Deploy WizardOfOdds (foundation)

# Deployment FOUNDATION only. This workflow is not triggered automatically
# by any push, and nothing in this change invokes it -- see
# docs/PLATFORM_AUTOMATION.md. Main-only, workflow_dispatch-only.
#
# Never touches the existing WNBA deployment, the existing separate NFL
# game-model deployment, any other systemd service, nginx, or DNS: every
# remote path this workflow writes to is under RELEASE_ROOT
# (/home/wizard-deploy/nflprops -- the isolated runtime root approved by
# BLOCK 2B's Wizard probe). Never /home/wizard-deploy/nfl-production-2026
# or /var/www/sportsodds.
#
# BLOCK 2B release contract (deploy/wizard/*.sh, streamed over SSH):
#   1. upload the release archive to releases/<release-id>.tar.gz
#   2. prepare_release.sh -- entirely BEFORE activation: extract into the
#      immutable releases/<release-id>/, build ITS OWN .venv
#      (`.[orchestration,runtime]`), and run the pre-activation checks from
#      that venv. Any failure deletes the partial release; `current` is
#      never touched.
#   3. activate_release.sh -- atomically switch `current`, restart
#      nflprops-runtime.service, require it ACTIVE, require the versioned
#      deploy-gate health from current/.venv to PASS. On failure: restore
#      the previous `current`, restart, re-verify health, and FAIL the
#      workflow either way (hard fail if the rollback itself fails).
# No step masks a failure. Does not start continuous collection -- the
# unit's ExecStart is the read-only health gate; collection is Block 3.
#
# Requires the one-time root setup first (unit installed + scoped sudoers
# rule); until then, prepare_release.sh's preflight fails closed.

on:
  workflow_dispatch:
    inputs:
      release_ref:
        description: "Explicit 40-character git SHA on main to deploy."
        required: true
        type: string

permissions:
  contents: read

env:
  RELEASE_ROOT: /home/wizard-deploy/nflprops

jobs:
  guard:
    name: Enforce main-only deployment
    runs-on: ubuntu-latest
    outputs:
      allowed: ${{ steps.check.outputs.allowed }}
    steps:
      - id: check
        run: |
          if [ "${{ github.ref }}" != "refs/heads/main" ]; then
            echo "::error::WizardOfOdds deployment may only run from main (got ${{ github.ref }})"
            echo "allowed=false" >> "$GITHUB_OUTPUT"
            exit 1
          fi
          if ! [[ "${{ inputs.release_ref }}" =~ ^[0-9a-fA-F]{40}$ ]]; then
            echo "::error::release_ref must be an explicit 40-character git SHA"
            echo "allowed=false" >> "$GITHUB_OUTPUT"
            exit 1
          fi
          echo "allowed=true" >> "$GITHUB_OUTPUT"

  deploy:
    name: Atomic release to wizardofodds.com
    needs: guard
    if: needs.guard.outputs.allowed == 'true'
    runs-on: ubuntu-latest
    environment: wizardofodds.com
    concurrency:
      group: deploy-wizard
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.release_ref }}
          fetch-depth: 1

      - name: Verify checked-out SHA matches release_ref
        run: |
          ACTUAL="$(git rev-parse HEAD)"
          if [ "$ACTUAL" != "${{ inputs.release_ref }}" ]; then
            echo "::error::checked out $ACTUAL but requested release_ref was ${{ inputs.release_ref }}"
            exit 1
          fi

      - name: Install SSH key and verified known_hosts
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "${{ secrets.WIZARD_SSH_PRIVATE_KEY }}" > ~/.ssh/wizard_deploy_key
          chmod 600 ~/.ssh/wizard_deploy_key
          printf '%s\n' "${{ secrets.WIZARD_SSH_KNOWN_HOSTS }}" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

      - name: Resolve release identity
        run: |
          RELEASE_SHA="$(git rev-parse HEAD)"
          {
            echo "RELEASE_SHA=$RELEASE_SHA"
            echo "RELEASE_ID=$RELEASE_SHA-${{ github.run_id }}-${{ github.run_attempt }}"
            echo "UNIT_SHA256=$(sha256sum deploy/systemd/nflprops-runtime.service | cut -d' ' -f1)"
          } >> "$GITHUB_ENV"

      - name: Build release archive
        run: |
          tar --exclude='.git' --exclude='.venv' -czf "$RUNNER_TEMP/release.tar.gz" .

      - name: Upload release archive
        # scp takes the port as -P (its -p means "preserve times"), so it
        # gets its own option string -- never the shared ssh SSH_OPTS.
        env:
          SSH_OPTS: -i ~/.ssh/wizard_deploy_key -p ${{ secrets.WIZARD_SSH_PORT }} -o UserKnownHostsFile=~/.ssh/known_hosts -o StrictHostKeyChecking=yes
          SCP_OPTS: -i ~/.ssh/wizard_deploy_key -P ${{ secrets.WIZARD_SSH_PORT }} -o UserKnownHostsFile=~/.ssh/known_hosts -o StrictHostKeyChecking=yes
        run: |
          REMOTE="${{ secrets.WIZARD_SSH_USER }}@${{ secrets.WIZARD_SSH_HOST }}"
          # shellcheck disable=SC2086,SC2029
          ssh $SSH_OPTS "$REMOTE" "install -d -m 750 '$RELEASE_ROOT' '$RELEASE_ROOT/releases'"
          # shellcheck disable=SC2086
          scp $SCP_OPTS "$RUNNER_TEMP/release.tar.gz" "$REMOTE:$RELEASE_ROOT/releases/$RELEASE_ID.tar.gz"

      - name: Install runtime env file if absent (environment secrets; never overwrites)
        env:
          SSH_OPTS: -i ~/.ssh/wizard_deploy_key -p ${{ secrets.WIZARD_SSH_PORT }} -o UserKnownHostsFile=~/.ssh/known_hosts -o StrictHostKeyChecking=yes
          BDL_API_KEY: ${{ secrets.BDL_API_KEY }}
        run: |
          REMOTE="${{ secrets.WIZARD_SSH_USER }}@${{ secrets.WIZARD_SSH_HOST }}"
          ENV_PATH="$RELEASE_ROOT/nflprops-runtime.env"
          # shellcheck disable=SC2086,SC2029
          STATE="$(ssh $SSH_OPTS "$REMOTE" "if [ -e '$ENV_PATH' ]; then echo EXISTS; else echo ABSENT; fi")"
          if [ "$STATE" = "EXISTS" ]; then
            echo "Runtime env file already present -- left untouched."
            exit 0
          fi
          if [ -z "$BDL_API_KEY" ]; then
            echo "::error::MISSING SECRET: BDL_API_KEY (wizardofodds.com environment) -- required to install $ENV_PATH"
            exit 1
          fi
          umask 077
          RENDERED="$RUNNER_TEMP/nflprops-runtime.env"
          # The secret is read from the environment and written only to a
          # 0600 runner-temp file streamed over SSH stdin -- never argv,
          # never echoed.
          python3 - "$RENDERED" <<'PY'
          import os
          import sys

          key = os.environ["BDL_API_KEY"]
          with open("deploy/systemd/nflprops-runtime.env.example") as handle:
              lines = handle.read().splitlines()
          rendered = [f"BDL_API_KEY={key}" if line == "BDL_API_KEY=" else line for line in lines]
          with open(sys.argv[1], "w") as handle:
              handle.write("\n".join(rendered) + "\n")
          PY
          # shellcheck disable=SC2086,SC2029
          ssh $SSH_OPTS "$REMOTE" "umask 077 && cat > '$ENV_PATH.new' && mv -n '$ENV_PATH.new' '$ENV_PATH' && test ! -e '$ENV_PATH.new'" < "$RENDERED"
          rm -f "$RENDERED"
          echo "Runtime env file installed (mode 600)."

      - name: Prepare release (own .venv + pre-activation checks; current untouched)
        env:
          SSH_OPTS: -i ~/.ssh/wizard_deploy_key -p ${{ secrets.WIZARD_SSH_PORT }} -o UserKnownHostsFile=~/.ssh/known_hosts -o StrictHostKeyChecking=yes
        run: |
          REMOTE="${{ secrets.WIZARD_SSH_USER }}@${{ secrets.WIZARD_SSH_HOST }}"
          # shellcheck disable=SC2086
          ssh $SSH_OPTS "$REMOTE" bash -s -- \
            "$RELEASE_ROOT" "$RELEASE_ID" "$RELEASE_SHA" "$UNIT_SHA256" \
            < deploy/wizard/prepare_release.sh

      - name: Activate + runtime health gate (rollback on failure)
        env:
          SSH_OPTS: -i ~/.ssh/wizard_deploy_key -p ${{ secrets.WIZARD_SSH_PORT }} -o UserKnownHostsFile=~/.ssh/known_hosts -o StrictHostKeyChecking=yes
        run: |
          REMOTE="${{ secrets.WIZARD_SSH_USER }}@${{ secrets.WIZARD_SSH_HOST }}"
          set +e
          # shellcheck disable=SC2086
          ssh $SSH_OPTS "$REMOTE" bash -s -- \
            "$RELEASE_ROOT" "$RELEASE_ID" "$RELEASE_SHA" \
            < deploy/wizard/activate_release.sh
          STATUS=$?
          set -e
          case "$STATUS" in
            0) echo "DEPLOYED: $RELEASE_ID" ;;
            1) echo "::error::DEPLOYMENT FAILED: $RELEASE_ID failed its runtime health gate; rolled back to the previous release (rollback health verified)" ;;
            2) echo "::error::HARD FAIL: $RELEASE_ID failed AND the rollback failed its health gate -- manual intervention required" ;;
            3) echo "::error::HARD FAIL: $RELEASE_ID failed and there is no previous release to roll back to" ;;
            *) echo "::error::DEPLOYMENT FAILED: activation refused or errored (status $STATUS); see log" ;;
          esac
          exit "$STATUS"

      - name: Cleanup SSH material
        if: always()
        run: rm -f ~/.ssh/wizard_deploy_key ~/.ssh/known_hosts "$RUNNER_TEMP/nflprops-runtime.env"
