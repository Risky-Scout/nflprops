name: CI

on:
  push:
    branches: [main, dev/nflprops-production]
  pull_request:
  schedule:
    # Nightly provider schema-drift check. SPEC §7.
    - cron: "0 9 * * *"

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      # [orchestration] pulls in prefect -- required so tests/orchestration/*
      # collect at all; those modules import nflprops.orchestration, which
      # imports prefect (see the [project.optional-dependencies] comment in
      # pyproject.toml). [storage] pulls in sqlalchemy/psycopg/alembic/boto3,
      # required for the Docker-gated PostgreSQL/MinIO integration tests this
      # job's own step name below claims to run. Neither is needed by core
      # model code.
      - run: pip install -e ".[dev,orchestration,storage]"

      - name: Validate machine-readable contracts
        run: python tools/validate_contracts.py

      - name: Verify packaged runtime resources are synchronized
        run: python tools/sync_runtime_resources.py --check

      - name: Build wheel and source distribution
        run: python -m build

      - name: Lint
        run: ruff check src tests

      - name: Byte-compile every module
        run: python -m compileall -q src

      - name: Test (includes Docker-gated PostgreSQL/MinIO integration tests where available)
        run: pytest -q

      # --- architectural guards. These are the rules that keep the package
      # --- maintainable; they run on every commit, not on review discipline.
      - name: Guard - endpoint strings contained
        run: |
          ! grep -rn "nfl/v1" src/ --include=*.py \
            | grep -v "providers/bdl/endpoints.py" \
            || (echo "FAIL: BDL endpoint string outside endpoints.py"; exit 1)

      - name: Guard - no provider imports in model layers
        run: |
          ! grep -rn "^\s*\(from\|import\).*providers\." \
            src/nflprops/models src/nflprops/features src/nflprops/simulation \
            src/nflprops/state src/nflprops/calibration src/nflprops/backtest \
            || (echo "FAIL: provider imported into a provider-independent layer"; exit 1)

      - name: Guard - no secrets committed
        run: |
          ! grep -rniE "(api[_-]?key|secret|token)\s*=\s*['\"][A-Za-z0-9_\-]{16,}" \
            src/ configs/ tools/ \
            || (echo "FAIL: possible hardcoded credential"; exit 1)

  typecheck:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # See the matching comment on the `test` job: mypy must see
      # prefect's/sqlalchemy's/etc. types to typecheck
      # src/nflprops/orchestration/* and src/nflprops/data/storage/*
      # correctly.
      - run: pip install -e ".[dev,orchestration,storage]"

      - name: Strict mypy non-regression gate
        run: |
          python tools/mypy_baseline.py \
            check \
            .github/mypy_baseline.json

  provider-contract:
    # Phase 1 is not complete while the authoritative BDL spec is a placeholder.
    # This job deliberately fails closed until the exact spec bytes are pinned.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install -e ".[dev]"
      - name: Verify pinned BDL OpenAPI contract
        run: nflprops provider verify bdl --strict-fields
      - name: Provider contract tests
        run: pytest tests/provider_contract -q


  leakage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install -e ".[dev]"
      - name: Point-in-time leakage detectors (SPEC §66)
        run: pytest tests/leakage -q

  invariants:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install -e ".[dev]"
      - name: Simulation invariants + determinism (SPEC §4, §67)
        run: pytest tests/invariants tests/determinism -q

  spec-drift:
    # Nightly only. Never silently upgrades production. SPEC §7.
    if: github.event_name == 'schedule'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install -e ".[dev]"
      - name: Detect BDL schema drift
        env:
          BDL_API_KEY: ${{ secrets.BDL_API_KEY }}
        run: nflprops provider drift bdl

  migration-head:
    # Alembic's migration graph must resolve to exactly one head. `alembic
    # heads` only inspects migrations/versions/ -- it needs no DATABASE_URL.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install -e ".[storage]"
      - name: Validate single Alembic head
        run: |
          alembic heads | tee /tmp/alembic_heads.txt
          COUNT=$(grep -c . /tmp/alembic_heads.txt || true)
          if [ "$COUNT" -ne 1 ]; then
            echo "FAIL: expected exactly one Alembic head, found $COUNT"
            exit 1
          fi

  platform-scope-guard:
    # PLATFORM AUTOMATION PRs must never touch model science or create a
    # migration (§1/§2 of the platform brief). This guard is specific to the
    # dedicated Platform-automation branch and compares against that PR's
    # ACTUAL base ref/merge-base -- it must never run on the eventual
    # dev/nflprops-production -> main integration PR, which legitimately
    # carries certified science changes accumulated on dev since main.
    if: github.event_name == 'pull_request' && github.head_ref == 'work/platform-automation'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Diff against PR base
        run: |
          git fetch origin "${{ github.event.pull_request.base.ref }}" --quiet
          BASE="$(git merge-base origin/${{ github.event.pull_request.base.ref }} HEAD)"
          echo "Comparing HEAD against merge-base $BASE (PR base: ${{ github.event.pull_request.base.ref }})"
          git diff --name-only "$BASE"...HEAD > /tmp/changed_files.txt
          cat /tmp/changed_files.txt

          FORBIDDEN='^src/nflprops/(calibration|distributions|simulation|projections|thresholds)/|^src/nflprops/market/current_pricing\.py$'
          if grep -E "$FORBIDDEN" /tmp/changed_files.txt; then
            echo "FAIL: this PR touches model-science files (see § SCIENCE IS OUT OF SCOPE)"
            exit 1
          fi

          if grep -E '^migrations/versions/' /tmp/changed_files.txt; then
            echo "FAIL: this PR adds/modifies an Alembic migration (§ NO ALEMBIC MIGRATION IN THIS PARALLEL PHASE)"
            exit 1
          fi
        # This job only guards the science/migration boundary described
        # above; it deliberately does not gate on any other path.
