# =====================================================================
# CANONICAL WAREHOUSE TABLE INVENTORY (NORMATIVE)
# Storage: Parquet files queried through DuckDB. No database server.
# Layers: raw -> bronze -> silver -> features/states -> predictions
# =====================================================================
version: "2026.1.0"

storage:
  format: parquet
  engine: duckdb
  compression: zstd

pit_columns_required_on_time_varying_tables:
  - event_time        # when the real-world event happened
  - available_at      # earliest timestamp this record could legitimately be known
  - ingested_at       # when WE wrote it
  - provider
  - provider_record_id

layers:
  raw: "data/raw/bdl/<endpoint>/ — immutable JSON + sidecar metadata"
  bronze: "1:1 typed parquet of raw payloads, provider IDs still present"
  silver: "canonical IDs, normalized types, deduplicated"
  features: "point-in-time feature rows keyed by (as_of, entity)"
  states: "empirical-Bayes posterior snapshots keyed by (as_of, entity, metric)"

tables:

  identity:
    teams:
      key: [canonical_team_id]
      pit: false
    players:
      key: [canonical_player_id]
      pit: false
    provider_team_ids:
      key: [provider, provider_team_id]
      pit: false
    provider_player_ids:
      key: [provider, provider_player_id]
      pit: false
    provider_game_ids:
      key: [provider, provider_game_id]
      pit: false

  schedule:
    games:
      key: [canonical_game_id, available_at]
      pit: true
      note: "append-only schedule/final snapshots; training outcomes use status_state == 'final' only"

  snapshots:
    roster_snapshots:
      key: [canonical_team_id, canonical_player_id, available_at]
      pit: true
      rule: "append-only; never overwrite"
    injury_snapshots:
      key: [canonical_player_id, available_at]
      pit: true
      rule: "append-only; Saturday never overwrites Monday"
    injury_snapshot_runs:
      key: [provider, available_at]
      pit: true
      deprecated: true
      note: >
        LEGACY (PHASE 2), read-only as of the post-PHASE-4 cleanup. No
        production code path writes new rows here anymore -- LeanIngestor's
        one-shot ingest_week() call site was removed. Preserved only so any
        pre-existing rows an old installation already has can still be
        migrated via migrate_legacy_injury_runs(). injury_data_available
        reads collector_resource_runs (see the collector layer below)
        exclusively. See nflprops.data.injury_availability.
      columns: [provider, snapshot_type, available_at, season, week, collection_status, row_count]

  collector:
    collector_runs:
      key: [collector_run_id]
      pit: true
      note: >
        PHASE 4. One row per overall collection cycle. NOT authoritative for
        resource-level feed availability by itself -- a cycle can be PARTIAL
        (some resources succeeded, some failed) or SUCCESS with a resource
        that returned zero legitimate rows. See collector_resource_runs.
      columns: [collector_run_id, provider, season, week, started_at, completed_at,
        status, cadence_seconds, nearest_unstarted_kickoff, games_requested,
        games_received, game_odds_rows, prop_rows, roster_rows, injury_rows,
        retry_count, error_code, error_detail, source_sha256, config_sha256,
        created_at]
    collector_resource_runs:
      key: [resource_run_id]
      pit: true
      note: >
        PHASE 4. Authoritative source for resource-level feed availability
        (games, rosters, injuries, game odds, player props). A successful
        fetch that legitimately returns zero rows (e.g. a healthy-slate
        injury check) is collection_status=SUCCESS with row_count=0 --
        never conflated with "the feed was never checked". MARKET_NOT_POSTED
        (market resources only) proves the feed was checked without
        implying any quote exists. See
        nflprops.collection.resource_availability.resource_feed_available_at.
      columns: [resource_run_id, collector_run_id, provider, resource_type,
        scope_type, scope_json, season, week, started_at, collector_received_at,
        completed_at, collection_status, row_count, retry_count, error_code,
        error_detail, raw_payload_sha256, created_at]

  outcomes:
    player_game_stats:
      key: [canonical_game_id, canonical_player_id]
      pit: true
      note: "PRIMARY GROUND TRUTH; retain every provider column"
    player_season_stats:
      key: [canonical_player_id, season, season_type]
      pit: false
      leakage: "QA only; never a point-in-time feature"
    team_game_stats:
      key: [canonical_game_id, canonical_team_id]
      pit: true
      note: "opponent features are built by REVERSING these rows within a game"
    team_season_stats:
      key: [canonical_team_id, season, season_type]
      pit: false
      warning: "schema exposes no opponent or defensive fields despite its description"

  advanced:
    advanced_passing_weekly:
      key: [canonical_player_id, season, week]
      pit: true
    advanced_rushing_weekly:
      key: [canonical_player_id, season, week]
      pit: true
    advanced_receiving_weekly:
      key: [canonical_player_id, season, week]
      pit: true

  pbp:
    plays_raw:
      key: [canonical_game_id, play_id]
      pit: true
    plays_parsed:
      key: [canonical_game_id, play_id]
      pit: true
    pbp_reconciliation:
      key: [canonical_game_id]
      pit: true
      columns: [pbp_quality, score, mismatch_report]

  market:
    game_odds_snapshots:
      key: [canonical_game_id, vendor, collector_received_at]
      pit: true
    game_opening_odds:
      key: [canonical_game_id, vendor]
      pit: true
    player_prop_snapshots:
      key: [canonical_game_id, canonical_player_id, prop_type, vendor, collector_received_at]
      pit: true
      note: "BDL retains no live prop history — this table IS the history"
    player_prop_openings:
      key: [canonical_game_id, canonical_player_id, prop_type, vendor]
      pit: true

  dfs:
    dfs_slates:
      key: [slate_id]
      pit: true
      optional: true
    dfs_draftables:
      key: [slate_id, draftable_id]
      pit: true
      optional: true

  state:
    player_states:
      key: [canonical_player_id, metric, as_of]
      pit: true
      columns: [posterior_mean, posterior_var, effective_n, prior_mean, last_updated]
    team_states:
      key: [canonical_team_id, metric, as_of]
      pit: true
      columns: [posterior_mean, posterior_var, effective_n, prior_mean, last_updated]
    role_states:
      key: [canonical_team_id, canonical_player_id, metric, as_of]
      pit: true
      columns: [posterior_mean, posterior_var, effective_n, prior_mean, last_updated]

  modeling:
    game_features:
      key: [canonical_game_id, as_of]
      pit: true
    player_features:
      key: [canonical_game_id, canonical_player_id, as_of]
      pit: true
    training_rows:
      key: [row_id]
      pit: true

  simulation:
    simulation_runs:
      key: [run_id]
      pit: false
    simulation_player_results:
      key: [run_id, draw_id, canonical_player_id]
      pit: false
      note: "the JOINT draw matrix; enables honest SGP pricing and correlation checks"

  output:
    predictions:
      key: [prediction_id]
      pit: false
      note: >
        PHASE 5: run_id/checkpoint_name are additive, nullable columns
        (null on any non-orchestration call site, e.g. ad-hoc backtests) --
        see nflprops.orchestration.run_store and
        prediction_runs (orchestration layer below) for the official
        checkpoint run they trace back to.
    settled_predictions:
      key: [prediction_id]
      pit: false

  orchestration:
    prediction_runs:
      key: [run_id]
      pit: true
      note: >
        PHASE 5. Operational/audit lifecycle for official per-game pregame
        checkpoints (T48H/T24H/T6H/T90M/T30M, plus MANUAL diagnostic runs).
        Never stores prediction outputs itself (those remain in
        predictions/simulation_player_results, immutable regardless of a
        run's status). scheduled_as_of is the model knowledge-time cutoff --
        never the wall-clock execution time. See
        nflprops.orchestration.run_store and
        docs/ORCHESTRATION_ARCHITECTURE.md.
      columns: [run_id, season, week, game_id, checkpoint_name, scheduled_as_of,
        kickoff_at, flow_started_at, flow_completed_at, status, model_version,
        config_sha256, source_sha256, data_manifest_sha256, n_draws,
        retained_joint_draws, publication_status, is_final_forecast,
        fallback_from_checkpoint, failure_code, failure_detail, created_at]
    player_game_projections:
      key: [projection_id]
      unique: [run_id, player_id, stat_name]
      foreign_key: {run_id: "prediction_runs.run_id"}
      pit: false
      note: >
        PHASE 7C. player_game_projections = immutable sportsbook-independent
        summarized player distribution output. One row per
        (run_id, player_id, stat_name) for each of the 30 approved Phase-7
        registry stats; projection_id = SHA-256(run_id | player_id |
        stat_name). Carries NO sportsbook fields and NO separate median
        column (p50 IS the median). Never updated or overwritten: an
        identical scientific re-run is an idempotent no-op, and any
        differing scientific field for an existing projection_id is a hard
        error. created_at is operational metadata only and is excluded from
        scientific equality. Requires a real prediction_runs parent row;
        ad-hoc/backtest projection frames stay in memory only. FK is NOT
        ON DELETE CASCADE. See nflprops.orchestration.projection_store and
        migrations/versions/0004_player_game_projections.py.
      columns: [projection_id, run_id, season, week, game_id, player_id,
        team_id, position_group, stat_name, n_draws, mean, p05, p10, p25,
        p50, p75, p90, p95, created_at]
    player_game_threshold_events:
      key: [threshold_event_id]
      unique: [run_id, player_id, stat_name, event_type, threshold]
      foreign_key: {run_id: "prediction_runs.run_id"}
      pit: false
      note: >
        PHASE 8C. player_game_threshold_events = immutable
        sportsbook-independent store of raw AT_LEAST threshold / milestone
        probabilities derived (PHASE 8B) from the SAME Phase-7 coherent
        simulation draws that feed player_game_projections. One row per
        (run_id, player_id, stat_name, event_type, threshold);
        threshold_event_id = SHA-256(run_id | player_id | stat_name |
        event_type | threshold). Stores ONLY p_hit (p_miss = 1 - p_hit is
        never stored) -- no American odds, no push probability, no EV, no
        vendor, no sportsbook line/price. CHECK constraints: threshold > 0,
        n_draws > 0, 0 <= p_hit <= 1, event_type = 'AT_LEAST'. Never
        updated or overwritten: an identical scientific re-run is an
        idempotent no-op, any differing scientific field for an existing
        threshold_event_id is a hard error, and p_hit equality is EXACT
        (no tolerance). created_at is operational metadata only, excluded
        from scientific equality. Requires a real prediction_runs parent
        row AND a complete Phase-7 player_game_projections artifact for the
        same run (the authoritative eligible-player set) -- the persisted
        product is the complete E x catalog.event_count grid, never a
        sparse subset. FK is NOT ON DELETE CASCADE. See
        nflprops.orchestration.threshold_event_store and
        migrations/versions/0005_player_game_threshold_events.py.
      columns: [threshold_event_id, run_id, season, week, game_id,
        player_id, team_id, position_group, stat_name, event_type,
        threshold, p_hit, n_draws, catalog_version, created_at]

  governance:
    model_registry:
      key: [model_version]
      pit: false
    data_manifests:
      key: [manifest_id]
      pit: false
