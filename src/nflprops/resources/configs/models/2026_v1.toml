# Model configuration for the 2026-2027 season build.
# Every FIT_ME must be replaced by a validated value before production.

[model]
version = "2026.1.0"
season = 2026

[model.training]
# Set from the empirical coverage report (SPEC §18). Do NOT hardcode a window
# before running `nflprops coverage`.
earliest_season = "SET_FROM_COVERAGE_REPORT"
cutoff = "SET_AT_TRAIN_TIME"
exclude_estimated_available_at = true

[model.props]
# Tier 1 and 2 are production candidates. Tier 3 is gated on PBP quality.
# See contracts/prop_map.yml.
enable_tier_1 = true
enable_tier_2 = true
enable_tier_3 = false            # flip only after PHASE 3 reports HIGH coverage

[model.challengers]
# Registered as challengers only. Promotion requires ALL Phase 10 gates.
residual_lightgbm = false
power_devig = false
shin_devig = false

[model.promotion_gates]
require_better_log_loss = true
require_neutral_or_better_brier = true
require_no_calibration_degradation = true
require_neutral_or_better_crps = true
require_pit_no_worse = true
require_season_stability = true
require_early_season_stability = true
require_late_season_stability = true
require_zero_leakage_failures = true
require_all_invariants_pass = true
require_reproducibility = true
